{% extends "base.html" %}

{% block title %}发布帖子{% endblock %}

{% block content %}
<h1>发布帖子</h1>

<p class="error" id="form-error" {% if not error %}hidden{% endif %}>{{ error or "" }}</p>

<form method="post" action="{{ url_for('posts.new_post') }}">
  <textarea name="content" rows="6" cols="60"
            placeholder="分享点什么…">{{ content or "" }}</textarea>
  <button type="submit">发布</button>
</form>
{% endblock %}
