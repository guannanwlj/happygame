{% extends "base.html" %}
{% block title %}注册 · 社交平台{% endblock %}
{% block content %}
<h1>用户注册</h1>
{% if error %}<p class="error" style="color: #b3261e;">{{ error }}</p>{% endif %}
<form method="post" action="/register">
  <p>
    <label for="username">用户名</label><br>
    <input type="text" id="username" name="username" value="{{ username }}"
           minlength="3" maxlength="30" pattern="[A-Za-z0-9_]+" required
           title="3–30 个字符，仅限字母、数字和下划线">
  </p>
  <p>
    <label for="password">密码</label><br>
    <input type="password" id="password" name="password"
           minlength="6" maxlength="128" required title="6–128 个字符">
  </p>
  <button type="submit">注册</button>
</form>
<p>已有账号？<a href="/login">去登录</a></p>
{% endblock %}
