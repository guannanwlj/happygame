<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}社交平台{% endblock %}</title>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; line-height: 1.6; }
    .site-header { display: flex; align-items: center; gap: 24px;
                   padding: 10px 24px; background: #1f2933; color: #f5f7fa; }
    .site-header a { color: #f5f7fa; text-decoration: none; margin-right: 12px; }
    .site-header a:hover { text-decoration: underline; }
    .flashes { list-style: none; margin: 0; padding: 8px 24px;
               background: #eef6ee; color: #22543d; }
    .site-content { padding: 16px 24px; max-width: 720px; }
  </style>
</head>
<body>
<header class="site-header">
  <strong class="brand">社交平台</strong>
  <nav class="site-nav">
    <a href="/">首页</a>
    <a href="/register">注册</a>
    <a href="/login">登录</a>
    <a href="/logout">登出</a>
    <a href="/friends/requests">好友请求</a>
    <a href="/friends">好友列表</a>
    <a href="/posts/new">发帖</a>
    <a href="/feed">好友动态</a>
  </nav>
</header>
{% with messages = get_flashed_messages() %}
  {% if messages %}
    <ul class="flashes">
      {% for message in messages %}<li class="flash">{{ message }}</li>{% endfor %}
    </ul>
  {% endif %}
{% endwith %}
<main class="site-content">
  {% block content %}{% endblock %}
</main>
</body>
</html>
